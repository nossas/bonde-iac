name: "cms-nossas"
namespace: "bonde-org"
replicas: 1
container:
  image: "nossas/nossas-cms:latest"
  port: 8000
  liveness_probe_path: null
  readiness_probe_path: null
  env:
    DJANGO_SETTINGS_MODULE: "org_nossas.nossas.settings.production"
    DEBUG: "False"
    AWS_STORAGE_BUCKET_NAME: "openactiontool-cms"
    DISABLE_RECAPTCHA: "False"
    BONDE_ACTION_API_URL: "http://api-graphql:80/v1/graphql"
    ALLOWED_HOSTS: "nossas.org,www.nossas.org"
    ADMINS: "('BONDE', 'suporte@bonde.org'),"
  env_from_secret:
    BONDE_DATABASE_URL: "bonde-database-url"
    CMS_DATABASE_URL: "nossas-database-url"
    AWS_ACCESS_KEY_ID: "aws-access-key"
    AWS_SECRET_ACCESS_KEY: "aws-secret-key"
    BONDE_ACTION_SECRET_KEY: "action-secret"
    SMTP_HOST: "smtp-secret"
    SMTP_PORT: "smtp-secret"
    SMTP_USER: "smtp-secret"
    SMTP_PASS: "smtp-secret"
  resources:
    requests:
      memory: "500Mi"
      cpu: "50m"
    limits:
      memory: "1000Mi"
      cpu: "200m"
service:
  type: "ClusterIP"
  port: 80
  target_port: 8000
ingress:
  enabled: false
labels:
  component: "cms"
  app: "cms-nossas"