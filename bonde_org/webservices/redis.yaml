name: "redis"
namespace: "bonde-org"
replicas: 1
container:
  image: "redis:7-alpine"  # Versão específica é mais segura que "latest"
  port: 6379
  command: ["redis-server"]
  args:
    - "--save"
    - "900 1"          # Persistência: salva a cada 15min se 1+ chaves mudaram
    - "--maxmemory"
    - "256mb"          # Limite de memória para controle
    - "--maxmemory-policy"
    - "allkeys-lru"    # Remove menos usados quando atinge limite
  env:
    REDIS_PASSWORD: ""  # Deixe vazio ou defina uma senha
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  liveness_probe_path: "/"  # Redis não tem endpoint HTTP, usaremos TCP check
  readiness_probe_path: "/"
service:
  type: "ClusterIP"
  port: 6379
  target_port: 6379
ingress:
  enabled: false  # Redis é interno, não exposto externamente
labels:
  component: "cache"
  app: "redis"